# openspec/config.yaml
# SDD configuration for portal-gcb (Grupo Cordillera Blanca SA)
# Generated by sdd-init phase

schema: spec-driven

context: |
  Stack: Astro 6.1.6 (static output) + React 19.2.5 (installed, unused)
        + TypeScript strict + Tailwind v4 (zombie, not wired) + PostCSS/Autoprefixer
        + Framer Motion 12 (unused) + @fontsource Manrope/Work Sans
  Pkg: Yarn 1.22.22, Node >=22.12.0
  Arch: Single route src/pages/index.astro -> Dashboard.astro (877 lines, orbital CSS engine)
        Layout.astro (37 lines, dark-mode flash prevention), global.css (45 lines reset+tokens)
        No content collections, data hardcoded in Dashboard frontmatter
  Testing: none configured
  Lint: none configured
  CI: none
  Deploy: static -> VPS /home/projects/portalweb dist, Nginx + Certbot, gcbprojects.site, 30d cache
  Conventions: lang=es (so/AR institutional), dark-first toggle (localStorage 'gcb-theme'),
               color tokens gold #C9A84C / gold-dark #A8834A / black #0A0A / cream #F5EDD8
               / surface #1C1C1C / elevated #242424, orbit inner=gold mid=#9B6DFF outer=#4A9FF
  Brand: TYPE-driven (no logo), gradient multicolor on company name
  Git: fresh workspace, no commits yet

rules:
  proposal:
    - Include rollback plan for risky changes (static deploy, no staging)
    - Identify affected modules (Dashboard.astro, Layout.astro, global.css, astro.config.mjs)
    - Note whether change touches the orbital animation engine (high-blast-radius)
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Specify behavior in Spanish (es-AR institutional tone) for user-facing strings
    - Mark dark-mode and light-mode as separate scenarios (dark-first toggle)
  design:
    - Document whether change activates zombie deps (Tailwind v4 wiring, React hydration, Framer Motion)
    - Include sequence diagrams for orbital animation or requestAnimationFrame flows
    - State CSS strategy: scoped <style> in .astro vs global.css vs Tailwind utilities (choose ONE per change)
    - Justify any new dependency against the "type-driven brand, no logo" principle
  tasks:
    - Group tasks by phase (infrastructure-wiring, implementation, visual-qa, deploy)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
    - Add an explicit "yarn build" verification task (static output must build clean)
  apply:
    - Follow existing scoped-<style> pattern in .astro files unless change mandates Tailwind wiring
    - Preserve dark-first toggle contract (dark is default when localStorage absent or != 'light')
    - Do NOT introduce a logo image; brand stays type-driven with gradient on company name
    - Keep Dashboard.astro orbital engine intact unless change explicitly targets it
    - Spanish (es-AR) for all user-facing copy
  verify:
    - Run `yarn build` (no test framework exists) and confirm static output is clean
    - Manual visual QA for dark-mode and light-mode (toggle contract)
    - Compare implementation against every spec scenario
    - Verify no zombie deps silently break the build (Tailwind/React/Framer must be wired OR absent)
  archive:
    - Warn before merging destructive deltas (large removals from Dashboard.astro)
    - Note any deps that moved from "zombie" to "active" or vice versa
